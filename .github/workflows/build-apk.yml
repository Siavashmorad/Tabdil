name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/**']

permissions:
  contents: read

concurrency:
  group: tabdil-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app-release.apk
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Do not enable setup-java Gradle caching here: the Android/Gradle tree
      # is generated later by `flutter create`, so there are no Gradle files
      # yet for setup-java to fingerprint.
      - name: Select Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          JAVA_MAJOR="$($JAVA_HOME/bin/java -version 2>&1 | awk -F'"' '/version/ {split($2,v,"."); print v[1]; exit}')"
          test "$JAVA_MAJOR" = "17"
          "$JAVA_HOME/bin/javac" -version

      - name: Install Flutter 3.24.0 from official release storage
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_VERSION='3.24.0'
          ARCHIVE="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}"
          curl --fail --location --retry 6 --retry-delay 5 --retry-all-errors -o "/tmp/${ARCHIVE}" "$URL"
          rm -rf "$HOME/flutter"
          tar -xJf "/tmp/${ARCHIVE}" -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" doctor -v

      - name: Validate project preparation script
        run: bash -n scripts/prepare_flutter_project.sh

      - name: Prepare canonical Flutter source tree
        run: bash scripts/prepare_flutter_project.sh

      - name: Generate Android platform with Flutter's own template
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.tabdealtrader --project-name tabdil --no-pub .
          fi
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml

      - name: Ensure network permissions are present
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          elif 'android.permission.ACCESS_NETWORK_STATE' not in s:
              s = s.replace('<application', '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          p.write_text(s)
          PY
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('android/app/build.gradle')
          s = app.read_text()
          s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 35', s, count=1)
          s = re.sub(r'compileSdkVersion\s+\S+', 'compileSdkVersion 35', s, count=1)
          app.write_text(s)
          PY

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Fix generated Flutter smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:crypto_trader/main.dart';
          void main() {
            testWidgets('app smoke test', (tester) async {
              await tester.pumpWidget(const CryptoTraderApp());
              expect(find.byType(CryptoTraderApp), findsOneWidget);
            });
          }
          EOF

      - name: Install Dart and Flutter dependencies
        run: flutter pub get

      - name: Resolve pub cache and wakelock_plus package
        id: package-paths
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$(dart pub cache path)"
          test -n "$CACHE_DIR"
          WakelockGradle="$(find "$CACHE_DIR/hosted/pub.dev" -path '*/wakelock_plus-*/android/build.gradle' -type f -print -quit 2>/dev/null || true)"
          echo "cache=$CACHE_DIR" >> "$GITHUB_OUTPUT"
          echo "wakelock_gradle=$WakelockGradle" >> "$GITHUB_OUTPUT"

      - name: Patch wakelock_plus Flutter Gradle properties if present
        env:
          WakelockGradle: ${{ steps.package-paths.outputs.wakelock_gradle }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WakelockGradle" ] || [ ! -f "$WakelockGradle" ]; then exit 0; fi
          python3 - "$WakelockGradle" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = re.sub(r'flutter\.[A-Za-z0-9_]*compileSdk[A-Za-z0-9_]*', '35', s)
          s = re.sub(r'flutter\.[A-Za-z0-9_]*minSdk[A-Za-z0-9_]*', '21', s)
          s = re.sub(r'flutter\.[A-Za-z0-9_]*targetSdk[A-Za-z0-9_]*', '35', s)
          s = re.sub(r'\bcompileSdkVersion\s+flutter\.[A-Za-z0-9_]+', 'compileSdkVersion 35', s)
          s = re.sub(r'\bminSdkVersion\s+flutter\.[A-Za-z0-9_]+', 'minSdkVersion 21', s)
          s = re.sub(r'\btargetSdkVersion\s+flutter\.[A-Za-z0-9_]+', 'targetSdkVersion 35', s)
          p.write_text(s)
          PY

      - name: Verify generated Android and package files
        shell: bash
        env:
          WakelockGradle: ${{ steps.package-paths.outputs.wakelock_gradle }}
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          if [ -n "$WakelockGradle" ] && [ -f "$WakelockGradle" ]; then
            if grep -Eq 'flutter\.[A-Za-z0-9_]+' "$WakelockGradle"; then exit 1; fi
          fi

      - name: Format Dart sources
        run: dart format --output=none lib test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Verify Gradle configuration
        working-directory: android
        run: ./gradlew --version

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK and network permissions in final manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" app-release.apk
          test -s app-release.apk
          echo "APK: $APK_SOURCE"
          sha256sum app-release.apk
          ls -lh app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabdil-release-apk
          path: app-release.apk
          retention-days: 30
          if-no-files-found: error
