name: Build Release APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, 'fix/**']

permissions:
  contents: read

jobs:
  build:
    name: Build app-release.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Prepare canonical Flutter source tree
        run: bash scripts/prepare_flutter_project_v2.sh

      - name: Generate Android platform only when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.tabdealtrader --project-name tabdil .
          fi

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
