name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/**']

permissions:
  contents: write

jobs:
  build:
    name: Build app-release.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Validate prepare script
        run: bash -n scripts/prepare_flutter_project.sh

      - name: Prepare Flutter source tree
        run: bash scripts/prepare_flutter_project.sh

      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.tabdealtrader --project-name tabdil --no-pub .
          fi

      - name: Align Android toolchain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path('android/settings.gradle')
          s = settings.read_text()
          s = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])', r'\g<1>8.8.2\2', s, count=1)
          s = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])', r'\g<1>2.2.0\2', s, count=1)
          settings.write_text(s)
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          ws = wrapper.read_text()
          ws = re.sub(r'distributionUrl=.*', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip', ws)
          wrapper.write_text(ws)
          app = Path('android/app/build.gradle')
          a = app.read_text()
          a = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 35', a)
          if 'ndkVersion' not in a:
              a = a.replace('compileSdk = 35', 'compileSdk = 35\n    ndkVersion = "27.0.12077973"', 1)
          else:
              a = re.sub(r'ndkVersion\s*=\s*[^\n]+', 'ndkVersion = "27.0.12077973"', a, count=1)
          app.write_text(a)
          PY

      - name: Force Kotlin version
        run: |
          cat > android/kotlin-toolchain.init.gradle <<'EOF'
          allprojects { project ->
            project.configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                  details.useVersion('2.2.0')
                }
              }
            }
          }
          EOF
          printf '\nkotlin.code.style=official\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch wakelock_plus Gradle
        run: |
          W="$PUB_CACHE/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle"
          if [ -f "$W" ]; then
            sed -i 's/flutter\.compileSdkVersion/35/g; s/flutter\.minSdkVersion/21/g; s/flutter\.targetSdkVersion/35/g' "$W"
          fi

      - name: Format and analyze
        run: |
          dart format lib test
          flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        working-directory: android
        run: ./gradlew --init-script kotlin-toolchain.init.gradle :app:assembleRelease --stacktrace

      - name: Locate and normalize release APK
        shell: bash
        run: |
          set -euo pipefail
          echo 'APK files produced:'
          find . -type f -name '*.apk' -print
          APK_SOURCE="$(find android/app/build android/build . -type f -name '*.apk' 2>/dev/null | head -n 1)"
          if [ -z "$APK_SOURCE" ]; then
            echo 'ERROR: Gradle completed but no APK was found.' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK_SOURCE" dist/Tabdil-release.apk
          test -s dist/Tabdil-release.apk
          ls -lh dist/Tabdil-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabdil-release-apk
          path: dist/Tabdil-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create prerelease
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tabdil build #${{ github.run_number }}
          files: dist/Tabdil-release.apk
          prerelease: true
