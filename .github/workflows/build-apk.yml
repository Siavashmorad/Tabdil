name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/**']

permissions:
  contents: read

concurrency:
  group: tabdil-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app-release.apk
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.24.0
        shell: bash
        run: |
          set -euo pipefail
          V=3.24.0
          A="flutter_linux_${V}-stable.tar.xz"
          curl --fail --location --retry 6 --retry-delay 5 --retry-all-errors -o "/tmp/$A" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$A"
          rm -rf "$HOME/flutter"
          tar -xJf "/tmp/$A" -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          flutter --version

      - name: Prepare Flutter project
        run: bash scripts/prepare_flutter_project.sh

      - name: Ensure Android platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/build.gradle ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --org com.tabdealtrader --project-name tabdil --no-pub .
          fi

      - name: Normalize generated Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/settings.gradle')
          s = p.read_text()

          def normalize(text, plugin, version):
              patterns = [
                  rf"(id\s*\(\s*['\"]{re.escape(plugin)}['\"]\s*\)\s*version\s*['\"])[^'\"]+(['\"])",
                  rf"(id\s+['\"]{re.escape(plugin)}['\"]\s+version\s+['\"])[^'\"]+(['\"])",
              ]
              for pat in patterns:
                  text, n = re.subn(pat, rf"\g<1>{version}\g<2>", text)
                  if n:
                      return text
              return text

          s = normalize(s, 'com.android.application', '8.7.3')
          s = normalize(s, 'org.jetbrains.kotlin.android', '2.2.0')

          agp = re.search(r"com\.android\.application['\"]?\s*\)?\s*version\s*['\"]([^'\"]+)", s)
          kotlin = re.search(r"org\.jetbrains\.kotlin\.android['\"]?\s*\)?\s*version\s*['\"]([^'\"]+)", s)
          if not agp or agp.group(1) != '8.7.3':
              raise SystemExit(f'Unable to normalize AGP. Detected: {agp.group(1) if agp else "none"}')
          if not kotlin or kotlin.group(1) != '2.2.0':
              raise SystemExit(f'Unable to normalize Kotlin. Detected: {kotlin.group(1) if kotlin else "none"}')
          p.write_text(s)

          w = Path('android/gradle/wrapper/gradle-wrapper.properties')
          ws = w.read_text()
          ws = re.sub(r'^distributionUrl=.*$', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip', ws, flags=re.M)
          w.write_text(ws)
          PY
          grep -nE 'com\.android\.application|org\.jetbrains\.kotlin\.android' android/settings.gradle
          grep -n 'distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Ensure network permissions
        shell: bash
        run: |
          set -euo pipefail
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          for n in ('android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE'):
              if n not in s:
                  s=s.replace('<application', f'    <uses-permission android:name="{n}" />\n    <application', 1)
          p.write_text(s)
          PY
          grep -q 'android.permission.INTERNET' "$M"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$M"

      - name: Configure compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle'); s=p.read_text()
          if re.search(r'compileSdk\s*=\s*',s): s=re.sub(r'compileSdk\s*=\s*[^\n]+','compileSdk = 35',s,count=1)
          elif re.search(r'compileSdkVersion\s+',s): s=re.sub(r'compileSdkVersion\s+\S+','compileSdkVersion 35',s,count=1)
          else: s=s.replace('android {','android {\n    compileSdkVersion 35',1)
          p.write_text(s)
          PY

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch wakelock_plus root Android plugin
        shell: bash
        run: |
          set -euo pipefail
          C="${PUB_CACHE:-$HOME/.pub-cache}"
          W="$(find "$C/hosted/pub.dev" -path '*/wakelock_plus-*/android/build.gradle' -type f -not -path '*/example/*' -print -quit 2>/dev/null || true)"
          test -n "$W"
          python3 - "$W" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text()
          s=re.sub(r'flutter\.[A-Za-z0-9_]*(compileSdk|minSdk|targetSdk)[A-Za-z0-9_]*', lambda m: {'compileSdk':'35','minSdk':'21','targetSdk':'35'}[m.group(1)], s)
          s=re.sub(r'compileSdkVersion\s+flutter\.[A-Za-z0-9_]+','compileSdkVersion 35',s)
          s=re.sub(r'minSdkVersion\s+flutter\.[A-Za-z0-9_]+','minSdkVersion 21',s)
          s=re.sub(r'targetSdkVersion\s+flutter\.[A-Za-z0-9_]+','targetSdkVersion 35',s)
          if 'compileSdkVersion' not in s and 'compileSdk' not in s: s=s.replace('android {','android {\n    compileSdkVersion 35',1)
          if 'minSdkVersion' not in s and 'minSdk' not in s: s=s.replace('defaultConfig {','defaultConfig {\n        minSdkVersion 21',1)
          p.write_text(s)
          PY

      - name: Verify toolchain before Gradle
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'com\.android\.application.*8\.7\.3' android/settings.gradle
          grep -Eq 'org\.jetbrains\.kotlin\.android.*2\.2\.0' android/settings.gradle
          grep -q 'gradle-8.10.2-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          echo 'Android toolchain normalization verified.'

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos

      - name: Test Flutter
        run: flutter test

      - name: Verify Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" app-release.apk
          test -s app-release.apk
          sha256sum app-release.apk
          ls -lh app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabdil-release-apk
          path: app-release.apk
          retention-days: 30
          if-no-files-found: error
