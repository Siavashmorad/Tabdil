name: Build Release APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, 'fix/**']

permissions:
  contents: read

jobs:
  build:
    name: Build app-release.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Validate prepare script syntax
        run: bash -n scripts/prepare_flutter_project_v2.sh

      - name: Prepare canonical Flutter source tree
        run: bash scripts/prepare_flutter_project_v2.sh

      - name: Prepare Android platform in repository root
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.tabdealtrader \
              --project-name tabdil \
              --no-pub \
              .
          fi

      - name: Align Android build toolchain for Flutter 3.24
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('android/settings.gradle')
          text = settings.read_text()
          text, agp_count = re.subn(
              r"(id ['\"]com\.android\.application['\"] version ['\"])[^'\"]+(['\"])",
              r"\g<1>8.3.2\g<2>",
              text,
              count=1,
          )
          text, kotlin_count = re.subn(
              r"(id ['\"]org\.jetbrains\.kotlin\.android['\"] version ['\"])[^'\"]+(['\"])",
              r"\g<1>1.9.24\g<2>",
              text,
              count=1,
          )
          if agp_count != 1 or kotlin_count != 1:
              raise SystemExit(f'Expected one AGP and one Kotlin declaration; got AGP={agp_count}, Kotlin={kotlin_count}')
          settings.write_text(text)

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper_text = wrapper.read_text()
          wrapper_text, gradle_count = re.subn(
              r"distributionUrl=.*",
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip",
              wrapper_text,
              count=1,
          )
          if gradle_count != 1:
              raise SystemExit('Gradle wrapper distributionUrl was not found')
          wrapper.write_text(wrapper_text)
          print('Configured AGP 8.3.2, Kotlin 1.9.24 and Gradle 8.4.')
          PY
          grep -q "com.android.application.*8.3.2" android/settings.gradle
          grep -q "org.jetbrains.kotlin.android.*1.9.24" android/settings.gradle
          grep -q "gradle-8.4-bin.zip" android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix generated Flutter smoke test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:crypto_trader/main.dart';

          void main() {
            testWidgets('app smoke test', (tester) async {
              await tester.pumpWidget(const CryptoTraderApp());
              expect(find.byType(CryptoTraderApp), findsOneWidget);
            });
          }
          EOF

      - name: Verify Flutter Android integration
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q "dev.flutter.flutter-gradle-plugin" android/app/build.gradle
          grep -q "flutter.compileSdkVersion" android/app/build.gradle

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Verify APK output
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
