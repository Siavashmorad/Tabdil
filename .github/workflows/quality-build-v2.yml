name: Tabdil Quality Build v2

on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Verify canonical scanner tree
        run: |
          test -f lib/main.dart
          test -f lib/services/trading_controller.dart
          test -f lib/core/scanner/market_scanner.dart
          test -f lib/core/models/trade_signal.dart
          grep -q "class MarketScanner" lib/core/scanner/market_scanner.dart
          grep -q "class TabdilApp" lib/main.dart

      - name: Prepare Android project without rewriting Dart sources
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.tabdealtrader --project-name tabdil --no-pub .
          fi

      - name: Align Android toolchain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/settings.gradle')
          s = p.read_text()
          s = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])', r'\g<1>8.8.2\2', s, count=1)
          s = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])', r'\g<1>2.2.0\2', s, count=1)
          p.write_text(s)
          w = Path('android/gradle/wrapper/gradle-wrapper.properties')
          ws = w.read_text()
          ws = re.sub(r'distributionUrl=.*', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip', ws)
          w.write_text(ws)
          a = Path('android/app/build.gradle')
          atext = a.read_text()
          atext = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 35', atext, count=1)
          if 'ndkVersion' not in atext:
              atext = atext.replace('android {', 'android {\n    ndkVersion = "27.0.12077973"', 1)
          else:
              atext = re.sub(r'ndkVersion\s*=\s*["\'][^"\']+["\']', 'ndkVersion = "27.0.12077973"', atext, count=1)
          a.write_text(atext)
          PY

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Get dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test

      - name: Release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabdil-quality-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
