name: Build Release APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, 'fix/**']

permissions:
  contents: read

jobs:
  build:
    name: Build app-release.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Validate prepare script syntax
        run: bash -n scripts/prepare_flutter_project_v2.sh

      - name: Prepare canonical Flutter source tree
        run: bash scripts/prepare_flutter_project_v2.sh

      - name: Prepare Android platform in repository root
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.tabdealtrader \
              --project-name tabdil \
              --no-pub \
              .
          fi

      - name: Fix generated Flutter smoke test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:crypto_trader/main.dart';

          void main() {
            testWidgets('app smoke test', (tester) async {
              await tester.pumpWidget(const CryptoTraderApp());
              expect(find.byType(CryptoTraderApp), findsOneWidget);
            });
          }
          EOF

      - name: Verify Flutter Android integration
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          grep -q "dev.flutter.flutter-gradle-plugin" android/app/build.gradle
          grep -q "flutter.compileSdkVersion" android/app/build.gradle

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch wakelock_plus Gradle for Flutter 3.24
        run: |
          WakelockGradle="$PUB_CACHE/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle"
          test -f "$WakelockGradle"
          python3 - "$WakelockGradle" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          replacements = {
              'flutter.compileSdkVersion': '34',
              'flutter.minSdkVersion': '21',
              'flutter.targetSdkVersion': '34',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          print(p.read_text())
          PY
          grep -Eq 'compileSdkVersion[[:space:]]+34|compileSdk[[:space:]]+34' "$WakelockGradle"
          ! grep -q 'flutter\.compileSdkVersion' "$WakelockGradle"
          ! grep -q 'flutter\.minSdkVersion' "$WakelockGradle"
          ! grep -q 'flutter\.targetSdkVersion' "$WakelockGradle"

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
