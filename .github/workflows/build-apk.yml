name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/**']

permissions:
  contents: read

concurrency:
  group: tabdil-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app-release.apk
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

      - name: Install Flutter 3.24.0
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_VERSION='3.24.0'
          ARCHIVE="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}"
          curl --fail --location --retry 6 --retry-delay 5 --retry-all-errors -o "/tmp/${ARCHIVE}" "$URL"
          rm -rf "$HOME/flutter"
          tar -xJf "/tmp/${ARCHIVE}" -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Prepare canonical Flutter source tree
        run: bash scripts/prepare_flutter_project.sh

      - name: Ensure complete Android platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/build.gradle ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --org com.tabdealtrader --project-name tabdil --no-pub .
          fi
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml

      - name: Align Android Gradle and Kotlin toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('android/settings.gradle')
          s = settings.read_text()
          s = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+)["\'][^"\']+["\']', r'\g<1>"8.7.3"', s)
          s = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+)["\'][^"\']+["\']', r'\g<1>"2.2.0"', s)
          settings.write_text(s)
          if 'id("com.android.application") version "8.7.3"' not in s and "id('com.android.application') version '8.7.3'" not in s:
              raise SystemExit('AGP 8.7.3 was not applied to android/settings.gradle')
          if 'id("org.jetbrains.kotlin.android") version "2.2.0"' not in s and "id('org.jetbrains.kotlin.android') version '2.2.0'" not in s:
              raise SystemExit('Kotlin 2.2.0 was not applied to android/settings.gradle')

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          w = wrapper.read_text()
          w = re.sub(r'distributionUrl=.*', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip', w)
          wrapper.write_text(w)
          PY
          grep -nE 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle
          grep -n 'distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Ensure network permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          for name in ('android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE'):
              if name not in s:
                  s = s.replace('<application', f'    <uses-permission android:name="{name}" />\n    <application', 1)
          p.write_text(s)
          PY
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"

      - name: Configure Android SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('android/app/build.gradle')
          s = app.read_text()
          s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 35', s, count=1)
          s = re.sub(r'compileSdkVersion\s+\S+', 'compileSdkVersion 35', s, count=1)
          app.write_text(s)
          PY

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Fix generated smoke test
        shell: bash
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:crypto_trader/main.dart';
          void main() {
            testWidgets('app smoke test', (tester) async {
              await tester.pumpWidget(const CryptoTraderApp());
              expect(find.byType(CryptoTraderApp), findsOneWidget);
            });
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve pub cache and wakelock_plus
        id: package-paths
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PUB_CACHE:-}" ]; then CACHE_DIR="$PUB_CACHE"; else CACHE_DIR="$HOME/.pub-cache"; fi
          CACHE_DIR="$(cd "$CACHE_DIR" 2>/dev/null && pwd || true)"
          test -n "$CACHE_DIR"
          WakelockGradle="$(find "$CACHE_DIR/hosted/pub.dev" -path '*/wakelock_plus-*/android/build.gradle' -type f -not -path '*/example/*' -print -quit 2>/dev/null || true)"
          test -n "$WakelockGradle"
          case "$WakelockGradle" in */example/*) exit 1;; esac
          echo "wakelock_gradle=$WakelockGradle" >> "$GITHUB_OUTPUT"

      - name: Patch wakelock_plus root Android plugin
        env:
          WakelockGradle: ${{ steps.package-paths.outputs.wakelock_gradle }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$WakelockGradle" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = re.sub(r'flutter\.[A-Za-z0-9_]*compileSdk[A-Za-z0-9_]*', '35', s)
          s = re.sub(r'flutter\.[A-Za-z0-9_]*minSdk[A-Za-z0-9_]*', '21', s)
          s = re.sub(r'flutter\.[A-Za-z0-9_]*targetSdk[A-Za-z0-9_]*', '35', s)
          s = re.sub(r'compileSdkVersion\s+flutter\.[A-Za-z0-9_]+', 'compileSdkVersion 35', s)
          s = re.sub(r'minSdkVersion\s+flutter\.[A-Za-z0-9_]+', 'minSdkVersion 21', s)
          s = re.sub(r'targetSdkVersion\s+flutter\.[A-Za-z0-9_]+', 'targetSdkVersion 35', s)
          if 'compileSdkVersion' not in s and 'compileSdk' not in s:
              s = s.replace('android {', 'android {\n    compileSdkVersion 35', 1)
          if 'minSdkVersion' not in s and 'minSdk' not in s:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        minSdkVersion 21', 1)
          p.write_text(s)
          PY

      - name: Verify project before build
        shell: bash
        env:
          WakelockGradle: ${{ steps.package-paths.outputs.wakelock_gradle }}
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -Eq 'com.android.application.*8\.7\.3' android/settings.gradle
          grep -Eq 'org.jetbrains.kotlin.android.*2\.2\.0' android/settings.gradle
          ! grep -Eq 'flutter\.[A-Za-z0-9_]+' "$WakelockGradle"
          grep -Eq 'compileSdkVersion[[:space:]]+35|compileSdk[[:space:]]*=[[:space:]]*35' "$WakelockGradle"

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Verify Gradle configuration
        working-directory: android
        run: ./gradlew --version

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" app-release.apk
          test -s app-release.apk
          sha256sum app-release.apk
          ls -lh app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabdil-release-apk
          path: app-release.apk
          retention-days: 30
          if-no-files-found: error
