name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/**']

permissions:
  contents: write

jobs:
  build:
    name: Build app-release.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Avoid codeload.github.com rate limits from setup-java/flutter-action.
      # GitHub-hosted Ubuntu images already provide a Java 17 runtime; Flutter is
      # downloaded directly from Google's official Flutter release storage.
      - name: Verify Java 17
        run: |
          java -version
          test "$(java -version 2>&1 | sed -n 's/.*version \"\([0-9]*\).*/\1/p' | head -n1)" = "17"

      - name: Install Flutter 3.24.0 from official release storage
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_VERSION='3.24.0'
          ARCHIVE="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors -o "/tmp/${ARCHIVE}" "$URL"
          rm -rf "$HOME/flutter"
          tar -xJf "/tmp/${ARCHIVE}" -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Validate prepare script syntax
        run: bash -n scripts/prepare_flutter_project.sh

      - name: Prepare canonical Flutter source tree
        run: bash scripts/prepare_flutter_project.sh

      - name: Prepare Android platform in repository root
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.tabdealtrader --project-name tabdil --no-pub .
          fi

      - name: Align Android Gradle toolchain with current plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path('android/settings.gradle')
          s = settings.read_text()
          replacements = {
              r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])': r'\g<1>8.8.2\2',
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])': r'\g<1>2.2.0\2',
          }
          for pattern, replacement in replacements.items():
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update Android plugin: {pattern}')
          settings.write_text(s)
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          ws = wrapper.read_text()
          ws = re.sub(r'distributionUrl=.*', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip', ws)
          wrapper.write_text(ws)
          PY

      - name: Force one Kotlin version for every Android plugin
        run: |
          cat > android/kotlin-toolchain.init.gradle <<'EOF'
          allprojects { project ->
            project.configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                  details.useVersion('2.2.0')
                }
              }
            }
          }
          EOF
          cat >> android/gradle.properties <<'EOF'
          kotlin.code.style=official
          kotlin.jvm.target.validation.mode=warning
          EOF

      - name: Verify Android Gradle toolchain
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q "dev.flutter.flutter-gradle-plugin" android/app/build.gradle
          grep -q "org.jetbrains.kotlin.android.*2.2.0" android/settings.gradle
          grep -q "com.android.application.*8.8.2" android/settings.gradle
          grep -q "gradle-8.10.2-all.zip" android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix Android SDK and NDK versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 35', s, count=1)
          if 'ndkVersion' in s:
              s = re.sub(r'ndkVersion\s*=\s*["\'][^"\']+["\']', 'ndkVersion = "27.0.12077973"', s, count=1)
          else:
              s = s.replace('android {', 'android {\n    ndkVersion = "27.0.12077973"', 1)
          p.write_text(s)
          PY
          : > android/app/proguard-rules.pro

      - name: Fix generated Flutter smoke test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:crypto_trader/main.dart';
          void main() {
            testWidgets('app smoke test', (tester) async {
              await tester.pumpWidget(const CryptoTraderApp());
              expect(find.byType(CryptoTraderApp), findsOneWidget);
            });
          }
          EOF

      - name: Enable core library desugaring
        run: python3 patch_android_desugaring.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch wakelock_plus Gradle for Flutter 3.24
        run: |
          WakelockGradle="$PUB_CACHE/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle"
          if [ -f "$WakelockGradle" ]; then
            python3 - "$WakelockGradle" <<'PY'
          from pathlib import Path
          import re
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          for pattern, value in {
              r'flutter\.compileSdkVersion': '35',
              r'flutter\.minSdkVersion': '21',
              r'flutter\.targetSdkVersion': '35',
          }.items():
              s = re.sub(pattern, value, s)
          p.write_text(s)
          PY
          fi

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: ./gradlew --init-script kotlin-toolchain.init.gradle :app:assembleRelease --stacktrace
        working-directory: android

      - name: Locate and normalize release APK
        shell: bash
        run: |
          set -euo pipefail
          echo 'All APK files produced by Gradle:'
          find . -type f -name '*.apk' -not -path './.git/*' -print
          APK_SOURCE="$(find . -type f -name '*.apk' -not -path './.git/*' | head -n 1)"
          if [ -z "$APK_SOURCE" ]; then
            echo 'ERROR: Gradle completed but no APK file was produced.' >&2
            exit 1
          fi
          cp "$APK_SOURCE" app-release.apk
          test -s app-release.apk
          echo "Normalized APK: app-release.apk"
          ls -lh app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabdil-release-apk
          path: app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create prerelease on main/master
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tabdil Auto Build #${{ github.run_number }}
          files: app-release.apk
          prerelease: true
