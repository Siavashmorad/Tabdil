name: Build Release APK v2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, 'fix/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true
      - name: Prepare Flutter source tree
        run: bash scripts/prepare_flutter_project_v2.sh
      - name: Generate Android
        run: flutter create --platforms=android --org com.tabdealtrader --project-name tabdil .
      - name: Enable desugaring
        run: python3 patch_android_desugaring.py
      - name: Get dependencies
        run: flutter pub get
      - name: Format sources
        run: dart format lib test
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-v2
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
